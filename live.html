<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0F">
  <meta name="description" content="Nova 直播联盟：实时互动直播间，弹幕、礼物打赏与一键开播。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* https: ws://127.0.0.1:* ws://localhost:* wss:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title data-i18n="live.title">Nova 直播联盟 · 星际直播间</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="./lib/sha3.js"></script>
  <link rel="stylesheet" href="./apps-common.css">
</head>
<body>
  <div id="topbar"></div>

  <main class="page">
    <section class="hero">
      <span class="eyebrow">Nova Live</span>
      <h1 data-i18n="lve.k1">📡 直播联盟</h1>
      <p class="sub" data-i18n="lve.k2">实时弹幕互动、礼物打赏直接到主播，随时随地一键开播。直播画面由浏览器实时渲染。</p>
      <div class="row" style="margin-top:10px;">
        <a class="btn primary" href="#broadcast" data-i18n="lve.k3">🎙️ 我要开播</a>
      </div>
    </section>

    <div id="liveRoomView" style="display:none;"></div>

    <div class="section-head">
      <div class="section-title" data-i18n="lve.k4">🟢 在线直播间</div>
      <div class="row"><span class="tag live">LIVE</span><span class="tag" data-i18n="lve.k5">礼物打赏</span></div>
    </div>
    <div class="grid grid-4" id="roomGrid"></div>

    <div class="section-title" id="broadcast" data-i18n="lve.k6">🎙️ 一键开播</div>
    <div class="card">
      <div class="field"><label data-i18n="lve.k7">直播间标题</label><input id="bcTitle" placeholder="例如：深夜电台 · 量子钢琴" data-i18n-ph="lve.dyn.bctitle.ph"></div>
      <div class="row">
        <div class="field" style="flex:1;"><label data-i18n="lve.k8">分区</label>
          <select id="bcCat">
            <option data-i18n="lve.k9">音乐</option><option data-i18n="lve.k10">游戏</option><option data-i18n="lve.k11">聊天</option><option data-i18n="lve.k12">知识</option><option data-i18n="lve.k13">虚拟演出</option>
          </select>
        </div>
        <button class="btn primary" style="align-self:flex-end;" onclick="startBroadcast()" data-i18n="lve.k14">🔴 开始直播</button>
      </div>
    </div>
  </main>

  <script src="./apps-common.js"></script>
  <script src="./live.i18n.js"></script>
  <script>
    var N = NovaApps;
    var HOSTS = [
      { name: 'lve.demo.r4.host', addr: '0x' + 'e5'.repeat(20) },
      { name: 'lve.demo.r1.host', addr: '0x' + 'ea'.repeat(20) },
      { name: 'lve.demo.r2.host', addr: '0x' + 'eb'.repeat(20) },
      { name: 'lve.demo.r3.host', addr: '0x' + 'ec'.repeat(20) }
    ];
    var ROOMS = [
      { id: 'r1', title: 'lve.demo.r1.title', host: 'lve.demo.r1.host', hostAddr: HOSTS[1].addr, cat: 'lve.demo.r1.cat', viewers: 2341, art: '🌌', hue: 210 },
      { id: 'r2', title: 'lve.demo.r2.title', host: 'lve.demo.r2.host', hostAddr: HOSTS[2].addr, cat: 'lve.demo.r2.cat', viewers: 1286, art: '🌠', hue: 175 },
      { id: 'r3', title: 'lve.demo.r3.title', host: 'lve.demo.r3.host', hostAddr: HOSTS[3].addr, cat: 'lve.demo.r3.cat', viewers: 980, art: '🎮', hue: 265 },
      { id: 'r4', title: 'lve.demo.r4.title', host: 'lve.demo.r4.host', hostAddr: HOSTS[0].addr, cat: 'lve.demo.r4.cat', viewers: 542, art: '📡', hue: 330 }
    ];
    var BOT_MSGS = [
      'lve.demo.b1', 'lve.demo.b2', 'lve.demo.b3', 'lve.demo.b4', 'lve.demo.b5',
      'lve.demo.b6', 'lve.demo.b7', 'lve.demo.b8', 'lve.demo.b9', 'lve.demo.b10'
    ];
    var GIFTS = [
      { label: 'lve.demo.g1', amount: 1 }, { label: 'lve.demo.g2', amount: 5 },
      { label: 'lve.demo.g3', amount: 20 }, { label: 'lve.demo.g4', amount: 66 }
    ];
    var BOT_NICKS = ['lve.demo.n1', 'lve.demo.n2', 'lve.demo.n3', 'lve.demo.n4', 'lve.demo.n5'];
    var current = null; // {room, visual, chatTimer, botTimer, viewers}

    function allRooms() {
      return ROOMS.concat(N.rooms().map(function (r) { return r; }));
    }
    function findRoom(id) {
      return allRooms().filter(function (r) { return r.id === id; })[0];
    }
    function chatKey(id) { return 'nova_live_chat_' + id; }
    function roomChat(id) {
      var c = N.lsGet(chatKey(id), null);
      if (!c) {
        c = [
          { who: 'system', text: N.t('lve.demo.welcome') },
          { who: N.t('lve.demo.n1'), text: N.t('lve.demo.chat1') },
          { who: N.t('lve.demo.n2'), text: N.t('lve.demo.chat2') }
        ];
        N.lsSet(chatKey(id), c);
      }
      return c;
    }
    function addChat(id, who, text) {
      var c = roomChat(id);
      c.push({ who: who, text: text, ts: Date.now() });
      if (c.length > 60) c.shift();
      N.lsSet(chatKey(id), c);
      renderChat(id);
    }

    function renderRooms() {
      var el = document.getElementById('roomGrid');
      el.innerHTML = allRooms().map(function (r) {
        return '<div class="card media-card">' +
          '<div class="cover" style="background:linear-gradient(140deg, hsla(' + r.hue + ',85%,40%,0.25), hsla(' + (r.hue + 80) + ',80%,45%,0.3));">' +
            '<span>' + r.art + '</span><span class="play" onclick="enterRoom(\'' + r.id + '\')">▶</span>' +
          '</div>' +
          '<div class="row"><h3 style="flex:1;">' + N.esc(N.t(r.title)) + '</h3><span class="tag live">LIVE</span></div>' +
          '<div class="by">' + N.esc(N.t(r.host)) + ' · ' + N.t(r.cat) + '</div>' +
          '<div class="row-info"><span>👁 ' + N.fmt(r.viewers) + '</span><button class="btn small primary" onclick="enterRoom(\'' + r.id + '\')">' + N.t('lve.dyn.enter') + '</button></div>' +
        '</div>';
      }).join('');
    }

    function enterRoom(id) {
      var room = findRoom(id);
      if (!room) return;
      exitRoom();
      current = { room: room, viewers: room.viewers, t: 0 };
      var view = document.getElementById('liveRoomView');
      view.style.display = '';
      view.innerHTML =
        '<div class="section-title">🔴 ' + N.esc(N.t(room.title)) + '</div>' +
        '<div class="grid grid-2">' +
          '<div>' +
            '<div class="stage-wrap" style="min-height:420px;">' +
              '<canvas id="liveCanvas"></canvas>' +
              '<div class="stage-overlay" style="min-height:420px; justify-content:space-between;">' +
                '<div class="row"><span class="pill on">LIVE</span><span class="pill">👁 <b id="liveViewers">' + N.fmt(current.viewers) + '</b></span></div>' +
                '<div class="stage-info"><div class="np-title">' + N.esc(N.t(room.title)) + '</div><div class="np-artist dim">' + N.esc(N.t(room.host)) + ' · ' + N.t(room.cat) + '</div></div>' +
              '</div>' +
            '</div>' +
            '<div class="gift-row" style="justify-content:flex-start;">' +
              GIFTS.map(function (g, i) { return '<button class="gift-btn" onclick="sendGift(' + i + ')">' + N.t(g.label) + ' ' + g.amount + '</button>'; }).join('') +
            '</div>' +
          '</div>' +
          '<div class="chat-panel">' +
            '<div class="chat-head"><span>' + N.t('lve.dyn.danmaku') + '</span><button class="btn small" onclick="exitRoom()">' + N.t('lve.dyn.exit') + '</button></div>' +
            '<div class="chat-body" id="chatBody"></div>' +
            '<div class="chat-input"><input id="chatInput" placeholder="' + N.t('lve.dyn.chat.ph') + '" onkeydown="if(event.key===13)sendChat()"><button class="btn small primary" onclick="sendChat()">' + N.t('lve.dyn.send') + '</button></div>' +
          '</div>' +
        '</div>';
      var canvas = document.getElementById('liveCanvas');
      current.visual = N.startVisual(canvas, 'particles');
      renderChat(id);
      current.botTimer = setInterval(function () {
        var who = BOT_NICKS[Math.floor(Math.random() * BOT_NICKS.length)];
        var msg = BOT_MSGS[Math.floor(Math.random() * BOT_MSGS.length)];
        addChat(id, N.t(who), N.t(msg));
      }, 9000);
      current.viewerTimer = setInterval(function () {
        current.viewers += Math.floor(Math.random() * 7) - 2;
        current.viewers = Math.max(1, current.viewers);
        var el = document.getElementById('liveViewers');
        if (el) el.textContent = N.fmt(current.viewers);
      }, 2500);
      document.getElementById('liveRoomView').scrollIntoView({ behavior: 'smooth' });
    }
    function renderChat(id) {
      var body = document.getElementById('chatBody');
      if (!body) return;
      var msgs = roomChat(id);
      body.innerHTML = msgs.map(function (m) {
        if (m.who === 'system') return '<div class="chat-msg"><span class="who system">' + N.t('lve.dyn.system') + '</span>' + N.esc(m.text) + '</div>';
        return '<div class="chat-msg"><span class="who">' + N.esc(m.who) + '</span>' + N.esc(m.text) + '</div>';
      }).join('');
      body.scrollTop = body.scrollHeight;
    }
    function sendChat() {
      var id = current.room.id;
      var input = document.getElementById('chatInput');
      var text = input.value.trim();
      var s = N.getState();
      if (!text) return;
      if (!s.connected) { N.requireWallet().then(function (ok) { if (ok) sendChat(); }); return; }
      addChat(id, N.displayName(s.addr), text);
      input.value = '';
    }
    function sendGift(i) {
      var g = GIFTS[i];
      var room = current.room;
      N.requireWallet().then(function (ok) {
        if (!ok) return;
        N.novaPay({ to: room.hostAddr || N.TREASURY, amount: g.amount, memo: N.t('lve.dyn.gift.memo', { gift: N.t(g.label), room: N.t(room.title) }), app: 'live' }).then(function (r) {
          if (!r.ok) { N.toast(r.error, 'err'); return; }
          addChat(room.id, 'system', N.t('lve.dyn.gift.sent', { name: N.displayName(N.getState().addr), gift: N.t(g.label), amt: N.fmt(g.amount) }));
          N.toast(N.t('lve.dyn.gift.ok', { tx: r.txid.slice(0, 12) }));
        });
      });
    }
    function exitRoom() {
      if (!current) return;
      if (current.visual) current.visual.stop();
      if (current.botTimer) clearInterval(current.botTimer);
      if (current.viewerTimer) clearInterval(current.viewerTimer);
      current = null;
      document.getElementById('liveRoomView').style.display = 'none';
      renderRooms();
    }

    function startBroadcast() {
      var title = document.getElementById('bcTitle').value.trim();
      var cat = document.getElementById('bcCat').value;
      var s = N.getState();
      if (!s.connected) { N.requireWallet().then(function (ok) { if (ok) startBroadcast(); }); return; }
      if (!title) { N.toast(N.t('lve.dyn.title.need'), 'err'); return; }
      var rooms = N.rooms();
      var room = {
        id: 'br-' + Date.now().toString(36), title: title,
        host: N.displayName(s.addr), hostAddr: s.addr, cat: cat,
        viewers: 1, art: '🎙️', hue: Math.floor(Math.random() * 360), mine: true, ts: Date.now()
      };
      rooms.unshift(room);
      N.saveRooms(rooms);
      N.addPost(N.t('lve.dyn.live.post', { title: title }) + '🔴', 'live');
      document.getElementById('bcTitle').value = '';
      renderRooms();
      enterRoom(room.id);
      N.toast(N.t('lve.dyn.live.on'));
    }

    setInterval(function () {
      if (!document.hidden) renderRooms();
    }, 60000);

    N.init({ active: 'live', onReady: renderRooms });
  </script>
</body>
</html>

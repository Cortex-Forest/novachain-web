<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0F">
  <meta name="description" content="Nova 创作者订阅：按月/永久/分档订阅，自动续费，90% 归创作者 10% 归生态基金，订阅者徽章与优先购买权。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* https: ws://127.0.0.1:* ws://localhost:* wss:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title data-i18n="subscription.title">Nova 订阅 · 创作者会员</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="./lib/sha3.js"></script>
  <link rel="stylesheet" href="./apps-common.css">
  <style>
    .mod-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
    .mod-stat { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 14px; }
    .mod-stat .v { font-size: 22px; font-weight: 800; font-family: var(--font-mono); color: var(--accent); }
    .mod-stat .k { font-size: 12px; color: var(--dim); margin-top: 4px; }
    .mod-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 22px; }
    .mod-tab { padding: 9px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04); cursor: pointer; font-size: .85rem; color: var(--dim); transition: all .2s; }
    .mod-tab:hover { color: #fff; border-color: rgba(0,240,255,.35); }
    .mod-tab.active { background: linear-gradient(135deg, rgba(0,240,255,.18), rgba(180,77,255,.18));
      border-color: rgba(0,240,255,.45); color: #fff; }
    .mod-panel { display: none; } .mod-panel.active { display: block; }
    .mod-item { border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 14px; margin-bottom: 12px; background: rgba(255,255,255,.03); }
    .mod-item h4 { margin: 0 0 6px; font-size: .98rem; }
    .mod-sub { font-size: .8rem; color: var(--dim); line-height: 1.75; word-break: break-all; }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: .72rem; font-weight: 600; }
    .badge.good { background: rgba(80,220,150,.15); color: #50dc96; }
    .badge.warn { background: rgba(255,180,60,.15); color: #ffb43c; }
    .badge.dim { background: rgba(255,255,255,.1); color: var(--dim); }
    .mono { font-family: var(--font-mono); font-size: .78rem; }
    .form-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
    .form-row input, .form-row select { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.15);
      border-radius: 10px; padding: 9px 12px; color: #fff; font-size: .85rem; min-width: 150px; }
    @media (max-width: 900px) { .mod-stats { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <div id="topbar"></div>
  <main class="page">
    <section class="hero">
      <span class="eyebrow">SUBSCRIPTION · AUTO-RENEW · MEMBERSHIP</span>
      <h1 data-i18n="subs.k1">创作者订阅与会员</h1>
      <p class="sub" data-i18n="subs.k2">按月订阅、永久会员与分档订阅；自动续费、余额不足自动取消。订阅收入 90% 归创作者，10% 归生态基金；订阅者获得专属徽章、优先购买权与私密社区访问权。</p>
    </section>

    <section class="mod-stats" id="stats"></section>

    <div class="mod-tabs" id="tabs">
      <button class="mod-tab active" onclick="switchTab('browse')" data-i18n="subs.k3">发现创作者</button>
      <button class="mod-tab" onclick="switchTab('mine')" data-i18n="subs.k4">我的订阅</button>
      <button class="mod-tab" onclick="switchTab('creator')" data-i18n="subs.k5">创作者工作台</button>
    </div>

    <section class="mod-panel active" id="panel-browse">
      <div class="card"><h3 class="mb" data-i18n="subs.k6">订阅创作者</h3>
        <div class="form-row">
          <input id="subCreator" placeholder="创作者地址（0x…）" data-i18n-ph="sub.dyn.ph.creator">
          <select id="subTier"><option value="basic" data-i18n="subs.k7">基础档（月付 10 NOVA）</option><option value="premium" data-i18n="subs.k8">高级档（月付 30 NOVA）</option><option value="lifetime" data-i18n="subs.k9">永久会员（100 NOVA）</option></select>
          <input data-i18n-ph="subscription.ph.1" id="subAmount" type="number" step="0.01" placeholder="支付金额">
          <label class="dim" style="font-size:.8rem;"><input type="checkbox" id="subAuto" checked> <span data-i18n="sub.dyn.auto">自动续费</span></label>
          <button class="btn primary" onclick="doSubscribe()" data-i18n="subs.k10">订阅</button>
        </div>
        <p class="dim" style="font-size:12px;line-height:1.7;" data-i18n="subs.k11">权益：专属内容访问（密文自动解锁）· 订阅者徽章（不可转让 NFT）· 新作品优先购买权（上架前 24 小时）· 私密社区访问权。</p>
        <div id="creatorInfo"></div>
      </div>
    </section>

    <section class="mod-panel" id="panel-mine">
      <div class="card"><h3 class="mb" data-i18n="subs.k12">我的订阅</h3><div id="mySubs"><p class="dim" data-i18n="subs.k13">连接钱包后查看</p></div></div>
    </section>

    <section class="mod-panel" id="panel-creator">
      <div class="card"><h3 class="mb" data-i18n="subs.k14">创建订阅档位（创作者）</h3>
        <div class="form-row">
          <input data-i18n-ph="subscription.ph.2" id="crTierId" placeholder="档位 id（如 basic）">
          <input data-i18n-ph="subscription.ph.3" id="crTierName" placeholder="档位名称（如 基础档）">
          <input data-i18n-ph="subscription.ph.4" id="crTierPrice" type="number" step="0.01" placeholder="价格 (NOVA)">
          <select id="crTierPeriod"><option value="monthly" data-i18n="subs.k15">按月</option><option value="lifetime" data-i18n="subs.k16">永久</option></select>
          <button class="btn primary" onclick="doCreateTiers()" data-i18n="subs.k17">创建 / 更新档位</button>
        </div>
        <div id="crTiers"></div>
      </div>
      <div class="card" style="margin-top:14px;"><h3 class="mb" data-i18n="subs.k18">我的创作者统计</h3><div id="crStats"><p class="dim" data-i18n="subs.k19">连接钱包后查看</p></div></div>
    </section>
  </main>

  <script src="./apps-common.js"></script>
  <script src="./subscription.i18n.js"></script>
  <script>
  var N = window.NovaApps;
  var DEMO_CREATORS = [
    { addr: '0x' + '66'.repeat(20), tiers: [{ id: 'basic', name: 'sub.dyn.demo.tier.basic', price: 10, period: 'monthly' },
      { id: 'lifetime', name: 'sub.dyn.demo.tier.lifetime', price: 100, period: 'lifetime' }] }
  ];

  function stat(k, v) { return '<div class="mod-stat"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>'; }
  function esc(s) { return N.esc ? N.esc(String(s == null ? '' : s)) : String(s); }
  function switchTab(name) {
    document.querySelectorAll('.mod-tab').forEach(function (b) { b.classList.toggle('active', b.getAttribute('onclick').indexOf(name) >= 0); });
    document.querySelectorAll('.mod-panel').forEach(function (p) { p.classList.toggle('active', p.id === 'panel-' + name); });
    load();
  }
  function moduleOp(op, fields, amount) {
    var st = N.getState();
    if (!st.connected) { N.toast(N.t('dyn.needwallet')); return Promise.resolve(null); }
    if (st.mode === 'demo') { N.toast(N.t('dyn.demoop', { op: op })); return Promise.resolve({ ok: true, demo: true }); }
    return N.getPubFromPriv(st.priv).then(function (pub) {
      var ts = Math.floor(Date.now() / 1000);
      var data = JSON.stringify(Object.assign({ op: op }, fields || {}));
      var amtStr = (Number(amount || 0)).toFixed(8).replace(/0+$/, '').replace(/\.$/, '');
      return N.signMsg(st.priv, st.addr + st.addr + amtStr + ts + '[]' + data + pub).then(function (sig) {
        return N.api('/api/sub/op', 'POST', { addr: st.addr, amount: amount || 0, data: data,
          timestamp: ts, sender_public_key: pub, signature: sig }).then(function (res) {
          if (res && res.error) { N.toast(N.t('dyn.opfail', { msg: res.error })); return null; }
          N.toast(N.t('dyn.onchain', { tx: String((res && res.txid) || '').slice(0, 16) }));
          return res;
        });
      });
    }).catch(function (e) { N.toast(N.t('dyn.opfail', { msg: (e && e.message || e) })); return null; });
  }

  async function load() {
    var d = null;
    try { d = await N.api('/api/sub/summary'); } catch (e) {}
    var demo = !d || d.demoMode || !('creators' in (d || {}));
    d = d || {};
    document.getElementById('stats').innerHTML =
      stat(N.t('sub.dyn.stat.creators'), d.creators || 0) +
      stat(N.t('sub.dyn.stat.subs'), d.subscriptions || 0) +
      stat(N.t('sub.dyn.stat.active'), d.active || 0) +
      stat(N.t('sub.dyn.stat.events'), d.events || 0);
    if (demo) document.getElementById('stats').insertAdjacentHTML('beforeend', '<div class="mod-stat" style="grid-column:1/-1;"><span class="badge warn">' + N.t('sub.dyn.demo.badge') + '</span> ' + N.t('sub.dyn.demo.note') + '</div>');
    renderMine();
    renderCreator();
  }
  async function renderMine() {
    var st = N.getState();
    var el = document.getElementById('mySubs');
    if (!st.connected) return;
    var creator = document.getElementById('subCreator').value.trim();
    if (!creator) { el.innerHTML = N.t('sub.dyn.mine.hint'); return; }
    try {
      var s = await N.api('/api/sub/status/' + st.addr + '/' + creator);
      if (s && s.status && s.status !== 'none') {
        var badge = s.active ? N.t('sub.dyn.mine.active') : N.t('sub.dyn.mine.expired');
        el.innerHTML = '<div class="mod-item"><div class="sf-bar" style="display:flex;justify-content:space-between;">' +
          '<h4>' + esc(creator) + '</h4>' + badge + '</div>' +
          N.t('sub.dyn.mine.info', { tier: esc(s.tier_id || '-'), period: esc(s.period || '-'),
            expires: s.expires_at ? N.t('sub.dyn.mine.expiresIn', { t: N.timeAgo(s.expires_at) }) : '',
            renew: s.auto_renew ? N.t('sub.dyn.mine.autoRenew') : '' }) +
          '<div class="row" style="margin-top:8px;gap:8px;">' +
          (s.period !== 'lifetime' ? '<button class="btn" style="padding:6px 12px;font-size:.78rem;" onclick="doRenew()">' + N.t('sub.dyn.btn.renew') + '</button>' : '') +
          (s.period !== 'lifetime' ? '<button class="btn" style="padding:6px 12px;font-size:.78rem;" onclick="doCancel()">' + N.t('sub.dyn.btn.cancel') + '</button>' : '') +
          '</div></div>';
      } else {
        el.innerHTML = N.t('sub.dyn.mine.none');
      }
    } catch (e) {}
  }
  async function renderCreator() {
    var st = N.getState();
    if (!st.connected) return;
    try {
      var c = await N.api('/api/sub/creator/' + st.addr);
      if (c && c.tiers) {
        document.getElementById('crTiers').innerHTML = c.tiers.map(function (t) {
          var perks = (t.benefits || []).join('、') || N.t('sub.dyn.creator.defaultPerks');
          return '<div class="mod-item"><h4>' + esc(N.t(t.name)) + ' <span class="badge dim">' + esc(t.period) + '</span></h4>' +
            N.t('sub.dyn.creator.tierInfo', { price: N.fmt(t.price), perks: esc(perks) }) + '</div>';
        }).join('') || N.t('sub.dyn.creator.none');
        document.getElementById('crStats').innerHTML = N.t('sub.dyn.creator.stats', { subs: N.fmt(c.subscribers || 0), revenue: N.fmt(c.revenue || 0) });
      }
    } catch (e) {}
  }

  function doSubscribe() {
    var creator = document.getElementById('subCreator').value.trim();
    var tier = document.getElementById('subTier').value;
    var amount = Number(document.getElementById('subAmount').value);
    if (!creator) { N.toast(N.t('sub.dyn.toast.creator')); return; }
    if (!amount || amount <= 0) { N.toast(N.t('sub.dyn.toast.amount')); return; }
    moduleOp('nova:sub:subscribe', { creator: creator, tier_id: tier,
      auto_renew: document.getElementById('subAuto').checked }, amount).then(function () { load(); });
  }
  function doRenew() {
    var creator = document.getElementById('subCreator').value.trim();
    if (!creator) { N.toast(N.t('sub.dyn.toast.creator')); return; }
    moduleOp('nova:sub:renew', { creator: creator }).then(function () { load(); });
  }
  function doCancel() {
    var creator = document.getElementById('subCreator').value.trim();
    if (!creator) { N.toast(N.t('sub.dyn.toast.creator')); return; }
    moduleOp('nova:sub:cancel', { creator: creator }).then(function () { load(); });
  }
  function doCreateTiers() {
    var id = document.getElementById('crTierId').value.trim();
    var name = document.getElementById('crTierName').value.trim();
    var price = Number(document.getElementById('crTierPrice').value);
    var period = document.getElementById('crTierPeriod').value;
    if (!id || !name || !price || price <= 0) { N.toast(N.t('sub.dyn.toast.tierinfo')); return; }
    moduleOp('nova:sub:create', { tiers: [{ id: id, name: name, price: price, period: period }] }).then(function () { load(); });
  }

  N.init({ active: 'subscription', onReady: function () { load(); } });
  </script>
</body>
</html>

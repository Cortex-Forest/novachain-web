<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#04050d">
  <meta name="description" content="Nova 社交圈：创作者动态流，点赞、评论、打赏与链上时间戳。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* https: ws://127.0.0.1:* ws://localhost:* wss:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Nova 社交圈 · 创作者社区</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/js-sha3@0.8.0/build/sha3.min.js" integrity="sha384-NKbaJKqJPrFeb86qfU2iNy4KO3oyIe6F5xm1PBYMpAkiVTxHjjafUKlebp0mAeNC" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="./apps-common.css">
</head>
<body>
  <div id="topbar"></div>

  <main class="page">
    <section class="hero">
      <span class="eyebrow">Nova Social</span>
      <h1>💬 社交圈</h1>
      <p class="sub">创作者的星际广场：发布动态即写入链上时间戳，点赞、评论与打赏全都可追溯。</p>
    </section>

    <div class="grid grid-2" style="grid-template-columns: 1fr 340px;">
      <div>
        <div class="card mb">
          <div class="field"><label>发布动态</label><textarea id="postBody" rows="3" placeholder="分享你的创作、灵感或今日星象…"></textarea></div>
          <div class="row">
            <button class="btn primary" onclick="composePost()">🚀 发布</button>
            <span class="dim">发布后自动写入链上时间戳</span>
          </div>
        </div>
        <div id="feedList"></div>
      </div>
      <div>
        <div class="card mb">
          <h3 class="mb">👤 我的档案</h3>
          <div class="row mb">
            <div class="avatar" id="myAvatar" style="width:56px;height:56px;font-size:26px;">🌌</div>
            <div style="flex:1;">
              <div class="field"><label>昵称</label><input id="myName" placeholder="你的名字"></div>
            </div>
          </div>
          <div class="field"><label>头像</label>
            <select id="myAvatarSel">
              <option>🌌</option><option>🚀</option><option>🎧</option><option>📖</option><option>🎮</option><option>🎬</option><option>🖼️</option><option>🌟</option><option>🐬</option><option>⚡</option>
            </select>
          </div>
          <button class="btn success block" onclick="saveProfile()">保存档案</button>
          <a class="btn block mt" href="./wallet.html">🔐 打开加密聊天</a>
        </div>
        <div class="card">
          <h3 class="mb">📊 我的数据</h3>
          <div class="stat-grid" style="grid-template-columns:1fr 1fr;">
            <div class="stat"><div class="num" id="myPosts">0</div><div class="label">我的动态</div></div>
            <div class="stat"><div class="num" id="myLikes">0</div><div class="label">获赞</div></div>
            <div class="stat"><div class="num" id="feedCount">0</div><div class="label">广场动态</div></div>
            <div class="stat"><div class="num" id="myFollow">0</div><div class="label">关注中</div></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="./apps-common.js"></script>
  <script>
    var N = NovaApps;

    function composePost() {
      var body = document.getElementById('postBody').value;
      var r = N.addPost(body, 'social');
      if (!r.ok) { N.toast(r.error, 'err'); return; }
      document.getElementById('postBody').value = '';
      N.toast('已发布并写入链上时间戳 ' + r.post.txid.slice(0, 12) + '…');
      renderFeed();
    }

    function likePost(id, btn) {
      var r = N.toggleLike(id);
      if (!r.ok) { N.toast(r.error, 'err'); return; }
      renderFeed();
    }

    function commentPost(id) {
      var input = document.getElementById('cmt-' + id);
      var text = input ? input.value.trim() : '';
      if (!text) return;
      var s = N.getState();
      if (!s.connected) { N.requireWallet().then(function (ok) { if (ok) commentPost(id); }); return; }
      var feed = N.feed();
      var post = null;
      for (var i = 0; i < feed.length; i++) { if (feed[i].id === id) { post = feed[i]; break; } }
      if (!post) return;
      post.comments.push({ addr: s.addr, name: N.displayName(s.addr), text: text, ts: Date.now() });
      N.saveFeed(feed);
      N.toast('评论已发布');
      renderFeed();
    }

    function tipPost(id) {
      var feed = N.feed();
      var post = null;
      for (var i = 0; i < feed.length; i++) { if (feed[i].id === id) { post = feed[i]; break; } }
      if (!post) return;
      N.requireWallet().then(function (ok) {
        if (!ok) return;
        N.novaPay({ to: post.addr, amount: 1, memo: '打赏动态「' + post.content.slice(0, 20) + '」', app: 'social' }).then(function (r) {
          if (!r.ok) { N.toast(r.error, 'err'); return; }
          N.toast('已打赏 1 NOVA，交易 ' + r.txid.slice(0, 12) + '…');
        });
      });
    }

    function renderFeed() {
      var s = N.getState();
      var feed = N.feed();
      var el = document.getElementById('feedList');
      var myAddr = s.addr;
      document.getElementById('feedCount').textContent = feed.length;
      document.getElementById('myPosts').textContent = myAddr ? feed.filter(function (p) { return p.addr === myAddr; }).length : 0;
      document.getElementById('myLikes').textContent = myAddr ? feed.reduce(function (n, p) { return n + (p.likes.indexOf(myAddr) >= 0 ? 1 : 0); }, 0) : 0;
      document.getElementById('myFollow').textContent = 2;
      if (!feed.length) { el.innerHTML = '<div class="empty">广场还很安静，发布第一条动态吧。</div>'; return; }
      el.innerHTML = feed.map(function (p) {
        var prof = N.profileOf(p.addr) || { avatar: '🌌' };
        var liked = myAddr && p.likes.indexOf(myAddr) >= 0;
        var comments = (p.comments || []).map(function (c) {
          return '<div class="chat-msg" style="border-top:1px solid rgba(255,255,255,0.05); padding-top:6px;"><span class="who">' + N.esc(c.name) + '</span>' + N.esc(c.text) + '</div>';
        }).join('');
        return '<div class="post">' +
          '<div class="post-head">' +
            '<div class="avatar">' + N.esc(prof.avatar || '🌌') + '</div>' +
            '<div><div class="name">' + N.esc(p.name) + '</div><div class="when">' + N.timeAgo(p.ts) + ' · ' + N.esc(N.shortAddr(p.addr)) + '</div></div>' +
          '</div>' +
          '<div class="content">' + N.esc(p.content) + '</div>' +
          (comments ? '<div style="margin-bottom:8px;">' + comments + '</div>' : '') +
          '<div class="row mb"><input id="cmt-' + p.id + '" placeholder="写评论…" style="flex:1; background:rgba(4,5,13,0.7); border:1px solid var(--border); border-radius:10px; padding:8px 12px; color:var(--text);">' +
            '<button class="btn small" onclick="commentPost(\'' + p.id + '\')">评论</button></div>' +
          '<div class="post-actions">' +
            '<button class="' + (liked ? 'liked' : '') + '" onclick="likePost(\'' + p.id + '\')">♥ ' + p.likes.length + '</button>' +
            '<button onclick="commentPost(\'' + p.id + '\')">💬 ' + (p.comments || []).length + '</button>' +
            '<button onclick="tipPost(\'' + p.id + '\')">🎁 打赏 1</button>' +
            '<span class="mono" style="margin-left:auto;">' + N.esc(p.txid.slice(0, 10)) + '…</span>' +
          '</div>' +
        '</div>';
      }).join('');
    }

    function saveProfile() {
      var s = N.getState();
      if (!s.connected) { N.requireWallet().then(function (ok) { if (ok) saveProfile(); }); return; }
      var name = document.getElementById('myName').value.trim();
      var avatar = document.getElementById('myAvatarSel').value;
      N.setProfile(s.addr, { name: name || undefined, avatar: avatar });
      document.getElementById('myAvatar').textContent = avatar;
      N.toast('档案已保存');
      renderFeed();
    }

    function loadProfile() {
      var s = N.getState();
      if (!s.addr) return;
      var p = N.profileOf(s.addr);
      if (!p) { N.ensureProfile(s.addr, '星主 ' + N.shortAddr(s.addr), '🌌'); return; }
      document.getElementById('myName').value = p.name || '';
      document.getElementById('myAvatarSel').value = p.avatar || '🌌';
      document.getElementById('myAvatar').textContent = p.avatar || '🌌';
    }

    window.addEventListener('nova-wallet', function () {
      loadProfile();
      renderFeed();
    });

    N.init({
      active: 'social',
      onReady: function () {
        loadProfile();
        renderFeed();
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova 钱包 SDK Demo</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; background: #07070f; color: #eef2ff;
         font-family: 'Segoe UI', system-ui, sans-serif; display: flex; align-items: center; justify-content: center; }
  .card { width: min(560px, 92vw); background: rgba(16,20,44,.85); border: 1px solid rgba(140,210,255,.18);
          border-radius: 18px; padding: 28px 30px; box-shadow: 0 18px 60px rgba(0,0,0,.5); }
  h1 { margin: 0 0 4px; font-size: 1.25rem; letter-spacing: .04em; }
  .sub { color: #8b93b8; font-size: .8rem; margin-bottom: 20px; }
  .row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  button { padding: 10px 16px; border-radius: 10px; border: 1px solid rgba(140,210,255,.35); background: transparent;
           color: #eef2ff; cursor: pointer; font-size: .85rem; }
  button.primary { background: linear-gradient(120deg, #00f0ff, #b44dff); color: #041018; font-weight: 700; border: none; }
  pre { background: #0b0e1f; border: 1px solid rgba(140,210,255,.14); border-radius: 12px; padding: 14px;
        font-size: .78rem; overflow: auto; min-height: 120px; white-space: pre-wrap; word-break: break-all; }
  .meta { font-size: .72rem; color: #7f88ad; margin-top: 12px; line-height: 1.7; }
</style>
</head>
<body>
  <div class="card">
    <h1>🪐 Nova 钱包 SDK Demo</h1>
    <div class="sub">接入示例：连接 / 地址 / 余额 / 转账 / 账户切换监听</div>
    <div class="row">
      <button class="primary" id="btnConnect">连接钱包</button>
      <button id="btnBalance">查询余额</button>
      <button id="btnSend">发送 1 NOVA（弹窗确认）</button>
    </div>
    <pre id="out">等待操作…</pre>
    <div class="meta" id="meta">加载 SDK 中…</div>
  </div>

  <script src="nova-wallet-sdk.js"></script>
  <script>
    (function () {
      const out = document.getElementById('out');
      const meta = document.getElementById('meta');
      const sdk = window.NovaWalletSDK;
      function log(label, data) {
        out.textContent = '▶ ' + label + '\n' + (typeof data === 'string' ? data : JSON.stringify(data, null, 2));
      }
      function errText(e) {
        return '错误码 ' + (e && e.code) + '：' + (e && e.message);
      }
      meta.textContent = 'SDK ' + sdk.VERSION + ' / 协议 v' + sdk.PROTOCOL_VERSION + ' / window.novaWallet=' + !!window.novaWallet;

      document.getElementById('btnConnect').addEventListener('click', async () => {
        try {
          const res = await sdk.connect();
          log('connect()', res);
          meta.textContent = '已连接：' + (res.accounts.length ? res.accounts[0] : '（钱包内尚无账户）');
        } catch (e) { log('connect() 失败', errText(e)); }
      });

      document.getElementById('btnBalance').addEventListener('click', async () => {
        try {
          const res = await sdk.getBalance();
          log('getBalance()', res);
        } catch (e) { log('getBalance() 失败', errText(e)); }
      });

      document.getElementById('btnSend').addEventListener('click', async () => {
        try {
          const { address } = await sdk.getAddress();
          if (!address) throw Object.assign(new Error('请先在钱包内创建账户'), { code: 4100 });
          const res = await sdk.sendTransaction({ to: address, amount: 1, memo: 'SDK demo' });
          log('sendTransaction()', res);
        } catch (e) { log('sendTransaction() 失败', errText(e)); }
      });

      sdk.onAccountsChanged(accounts => {
        log('accountsChanged', accounts);
        meta.textContent = '账户已切换：' + (accounts[0] || '空');
      });
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0F">
  <meta name="description" content="Nova NFT 收藏品：数字艺术市场、铸造、买卖与转让。">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' http://127.0.0.1:* http://localhost:* https: ws://127.0.0.1:* ws://localhost:* wss:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title data-i18n="nft.title">Nova 收藏品 · NFT 市场</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <script src="./lib/sha3.js"></script>
  <link rel="stylesheet" href="./apps-common.css">
</head>
<body>
  <div id="topbar"></div>

  <main class="page">
    <section class="hero">
      <span class="eyebrow">Nova Collectibles</span>
      <h1 data-i18n="nftx.k1">🖼️ NFT 收藏品</h1>
      <p class="sub" data-i18n="nftx.k2">数字艺术、唱片、演出门票与创作印记都在这里流转。铸造、买卖、转让，每一笔都有链上记录。</p>
      <div class="row" style="margin-top:10px;">
        <button class="btn primary" onclick="showTab('market')" data-i18n="nftx.k3">🛒 逛市场</button>
        <button class="btn" onclick="showTab('mint')" data-i18n="nftx.k4">⛏️ 去铸造</button>
        <button class="btn" onclick="showTab('mine')" data-i18n="nftx.k5">💾 我的收藏</button>
      </div>
    </section>

    <section>
      <div class="stat-grid">
        <div class="stat"><div class="num" id="sMarket">0</div><div class="label" data-i18n="nftx.k6">市场在售</div></div>
        <div class="stat"><div class="num" id="sMine">0</div><div class="label" data-i18n="nftx.k7">我的收藏</div></div>
        <div class="stat"><div class="num" id="sMinted">0</div><div class="label" data-i18n="nftx.k8">链上藏品</div></div>
        <div class="stat"><div class="num" id="sTx">0</div><div class="label" data-i18n="nftx.k9">交易笔数</div></div>
      </div>
    </section>

    <div class="tabs" style="margin-top:26px;">
      <button class="tab-btn active" data-tab="market" onclick="showTab('market')" data-i18n="nftx.k10">🛒 市场</button>
      <button class="tab-btn" data-tab="mine" onclick="showTab('mine')" data-i18n="nftx.k11">💾 我的收藏</button>
      <button class="tab-btn" data-tab="mint" onclick="showTab('mint')" data-i18n="nftx.k12">⛏️ 铸造</button>
      <button class="tab-btn" data-tab="tx" onclick="showTab('tx')" data-i18n="nftx.k13">🧾 交易记录</button>
    </div>

    <div id="tab-market" class="tab-panel">
      <div class="grid grid-4" id="marketGrid"></div>
    </div>

    <div id="tab-mine" class="tab-panel" style="display:none;">
      <div class="grid grid-4" id="mineGrid"></div>
    </div>

    <div id="tab-mint" class="tab-panel" style="display:none;">
      <div class="card" style="max-width:560px;">
        <h3 class="mb" data-i18n="nftx.k14">铸造新收藏品</h3>
        <div class="field"><label data-i18n="nftx.k15">名称</label><input data-i18n-ph="nft.ph.1" id="mName" placeholder="例如：量子极光 #001"></div>
        <div class="field"><label data-i18n="nftx.k16">描述</label><textarea data-i18n-ph="nft.ph.2" id="mDesc" rows="3" placeholder="讲讲这件藏品的来历…"></textarea></div>
        <div class="field"><label data-i18n="nftx.k17">图案</label>
          <select id="mArt">
            <option>💠</option><option>💎</option><option>🌌</option><option>🚀</option><option>👾</option><option>🎵</option><option>📜</option><option>🖼️</option><option>🌟</option><option>🪐</option><option>🐬</option><option>⚡</option>
          </select>
        </div>
        <div class="field"><label data-i18n="nftx.k18">售价（NOVA，0 为免费空投）</label><input id="mPrice" type="number" min="0" step="0.1" value="3"></div>
        <button class="btn primary block" onclick="mintNft()" data-i18n="nftx.k19">⛏️ 铸造并上链</button>
      </div>
    </div>

    <div id="tab-tx" class="tab-panel" style="display:none;">
      <div id="txList"></div>
    </div>
  </main>

  <script src="./apps-common.js"></script>
  <script src="./nft.i18n.js"></script>
  <script>
    var N = NovaApps;
    var APP_KEYS = { nft: 'nftx.dyn.app.nft', music: 'nftx.dyn.app.music', words: 'nftx.dyn.app.words', games: 'nftx.dyn.app.games', video: 'nftx.dyn.app.video', live: 'nftx.dyn.app.live', stage: 'nftx.dyn.app.stage', social: 'nftx.dyn.app.social' };
    function appLabel(a) { var k = APP_KEYS[a]; return k ? N.t(k) : N.t('nftx.dyn.app.tx'); }

    function showTab(name) {
      ['market', 'mine', 'mint', 'tx'].forEach(function (t) {
        document.getElementById('tab-' + t).style.display = t === name ? '' : 'none';
      });
      document.querySelectorAll('.tab-btn').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-tab') === name);
      });
      renderAll();
    }

    function renderStats() {
      var all = Object.keys(N.nftStore()).length;
      document.getElementById('sMarket').textContent = N.catalog().length;
      document.getElementById('sMine').textContent = N.myNfts().length;
      document.getElementById('sMinted').textContent = all;
      document.getElementById('sTx').textContent = N.ledger().length;
    }

    function cardOf(t, mode) {
      var creator = N.displayName(t.creator);
      var buy = mode === 'market' ? '<button class="btn small primary" onclick="buyNft(\'' + t.id + '\')">' + N.t('nftx.dyn.buy', { p: N.fmt(t.price) }) + '</button>' : '';
      var mine = mode === 'mine' ? '<button class="btn small" onclick="transferNft(\'' + t.id + '\')">' + N.t('nftx.dyn.transfer') + '</button>' : '';
      return '<div class="card media-card">' +
        '<div class="art-tile" onclick="detailNft(\'' + t.id + '\')" style="cursor:pointer;">' + N.esc(t.art) + '</div>' +
        '<div class="row mt"><h3 style="flex:1;">' + N.esc(t.name) + '</h3><span class="tag nft">' + appLabel(t.app) + '</span></div>' +
        '<div class="by">' + N.esc(creator) + '</div>' +
        '<div class="row-info"><span class="price">' + N.fmt(t.price) + ' NOVA</span><span class="mono dim">#' + N.esc(t.id.slice(-8)) + '</span></div>' +
        '<div class="actions">' + buy + mine +
          '<button class="btn small" onclick="detailNft(\'' + t.id + '\')">' + N.t('nftx.dyn.detail') + '</button></div>' +
      '</div>';
    }

    function renderAll() {
      renderStats();
      var market = document.getElementById('marketGrid');
      var mine = document.getElementById('mineGrid');
      var cat = N.catalog();
      market.innerHTML = cat.length
        ? cat.map(function (t) { return cardOf(t, 'market'); }).join('')
        : '<div class="empty" style="grid-column:1/-1;">' + N.t('nftx.dyn.market.empty') + '</div>';
      var my = N.myNfts();
      mine.innerHTML = my.length
        ? my.map(function (t) { return cardOf(t, 'mine'); }).join('')
        : '<div class="empty" style="grid-column:1/-1;">' + N.t('nftx.dyn.mine.empty') + '</div>';
      var ledger = N.ledger();
      var txEl = document.getElementById('txList');
      txEl.innerHTML = ledger.length ? ledger.slice(0, 15).map(function (t) {
        var dir = t.credit ? '<span class="ok">+' : '<span class="err">-';
        var dir2 = t.credit ? '</span>' : '</span>';
        return '<div class="list-row"><div class="rank">' + (t.credit ? '⬇' : '⬆') + '</div>' +
          '<div class="grow"><div class="t">' + N.esc(t.memo || appLabel(t.app)) + '</div>' +
          '<div class="d mono">' + N.esc(t.txid.slice(0, 14)) + '… · ' + N.timeAgo(t.ts) + '</div></div>' +
          '<div class="price">' + dir + N.fmt(t.amount) + dir2 + ' NOVA</div></div>';
      }).join('') : '<div class="empty">' + N.t('nftx.dyn.tx.empty') + '</div>';
    }

    function detailNft(id) {
      var t = N.nftById(id);
      if (!t) return;
      var isMine = t.owner === N.getState().addr;
      var actions = [];
      if (isMine) {
        actions.push({ label: N.t('nftx.dyn.transfer'), cls: 'primary', onClick: function () { N.closeModal(); transferNft(id); } });
      } else if (t.price > 0) {
        actions.push({ label: N.t('nftx.dyn.buy.price', { p: N.fmt(t.price) }), cls: 'primary', onClick: function () { N.closeModal(); buyNft(id); } });
      } else {
        actions.push({ label: N.t('nftx.dyn.free'), cls: 'primary', onClick: function () { N.closeModal(); buyNft(id); } });
      }
      actions.push({ label: N.t('nftx.dyn.close'), onClick: N.closeModal });
      N.openModal({
        title: t.name,
        body: '<div class="art-tile" style="font-size:84px;">' + N.esc(t.art) + '</div>' +
          '<div class="row mt"><span class="tag nft">' + appLabel(t.app) + '</span><span class="tag">' + (isMine ? N.t('nftx.dyn.mine.tag') : N.t('nftx.dyn.sale')) + '</span></div>' +
          '<p class="mt">' + N.esc(t.desc || '') + '</p>' +
          '<p class="dim mt">' + N.t('nftx.dyn.creator', { name: N.esc(N.displayName(t.creator)), addr: N.esc(N.shortAddr(t.creator)) }) + '</p>' +
          '<p class="dim">' + N.t('nftx.dyn.sn') + '<span class="mono">' + N.esc(t.id) + '</span></p>' +
          '<p class="dim">' + N.t('nftx.dyn.txid') + '<span class="mono">' + N.esc(t.txid) + '</span></p>',
        actions: actions
      });
    }

    function buyNft(id) {
      var t = N.nftById(id);
      if (!t) return;
      N.requireWallet().then(function (ok) {
        if (!ok) return;
        N.nftBuy(id).then(function (r) {
          if (!r.ok) { N.toast(r.error, 'err'); return; }
          N.toast(N.t('nftx.dyn.bought', { name: r.token.name }));
          renderAll();
        });
      });
    }

    function transferNft(id) {
      var t = N.nftById(id);
      if (!t) return;
      N.openModal({
        title: N.t('nftx.dyn.transfer.title', { name: t.name }),
        body: '<div class="field"><label>' + N.t('nftx.dyn.to.label') + '</label><input id="trAddr" class="mono" placeholder="' + N.t('nftx.dyn.to.ph') + '"></div>',
        actions: [
          { label: N.t('nftx.dyn.cancel'), onClick: N.closeModal },
          { label: N.t('nftx.dyn.transfer.confirm'), cls: 'primary', onClick: function () {
              var to = document.getElementById('trAddr').value.trim();
              N.nftTransfer(id, to).then(function (r) {
                if (!r.ok) { N.toast(r.error, 'err'); return; }
                N.closeModal();
                N.toast(N.t('nftx.dyn.transferred', { addr: N.shortAddr(to) }));
                renderAll();
              });
            } }
        ]
      });
    }

    function mintNft() {
      var s = N.getState();
      if (!s.connected) { N.requireWallet().then(function (ok) { if (ok) mintNft(); }); return; }
      var name = document.getElementById('mName').value.trim();
      var desc = document.getElementById('mDesc').value.trim();
      var art = document.getElementById('mArt').value;
      var price = parseFloat(document.getElementById('mPrice').value) || 0;
      if (!name) { N.toast(N.t('nftx.dyn.name.need'), 'err'); return; }
      N.nftMint({ name: name, desc: desc, art: art, price: Math.max(0, price), app: 'nft' }).then(function (r) {
        if (!r.ok) { N.toast(r.error, 'err'); return; }
        document.getElementById('mName').value = '';
        document.getElementById('mDesc').value = '';
        N.toast(N.t('nftx.dyn.minted', { id: r.token.id.slice(-8) }));
        showTab('mine');
      });
    }

    window.addEventListener('nova-wallet', renderAll);

    N.init({ active: 'nft', onReady: renderAll });
  </script>
</body>
</html>
